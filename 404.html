<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Sharp Bricklaying</title>
  <link rel="icon" type="image/png" href="images/logo-dark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #1B4332;
      --terracotta: #C1440E;
      --sand: #F5F0E8;
      --charcoal: #2C2C2C;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--sand);
      font-family: 'Lato', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 32px;
    }
    .error-page { max-width: 480px; }
    .error-code {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 140px;
      color: var(--green);
      line-height: 1;
      opacity: 0.15;
    }
    .error-heading {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 36px;
      text-transform: uppercase;
      color: var(--green);
      margin: -16px 0 16px;
    }
    .error-text {
      font-size: 15px;
      color: #6b6560;
      line-height: 1.7;
      margin-bottom: 32px;
    }
    .error-link {
      display: inline-block;
      background: var(--green);
      color: #fff;
      font-family: 'Lato', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 14px 32px;
      text-decoration: none;
      border: 2px solid var(--green);
      transition: background 0.2s, border-color 0.2s;
    }
    .error-link:hover {
      background: var(--terracotta);
      border-color: var(--terracotta);
    }
  </style>
</head>
<body>
  <div class="error-page">
    <div class="error-code">404</div>
    <h1 class="error-heading">Page Not Found</h1>
    <p class="error-text">Looks like this wall hasn't been built yet. The page you're looking for doesn't exist or has been moved.</p>
    <a href="/" class="error-link">Back to Home</a>
  </div>
</body>
</html>
